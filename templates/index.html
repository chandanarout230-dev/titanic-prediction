<!DOCTYPE html>
<html>

<head>
    <title>Titanic Survival Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🚢 Titanic Survival Predictor</h1>
    <h3>White Star Line Passenger Registry - 1912</h3>

    <form method="POST">

        <p>Passenger Class</p>
        <select name="pclass">
            <option value="1">First Class</option>
            <option value="2">Second Class</option>
            <option value="3">Third Class</option>
        </select>

        <p>Gender</p>
        <select name="sex">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <p>Age</p>
        <input type="number" name="age" required>

        <p>Siblings / Spouse</p>
        <input type="number" name="sibsp" required>

        <p>Parents / Children</p>
        <input type="number" name="parch" required>

        <p>Fare</p>
        <input type="number" step="0.01" name="fare" required>

        <p>Embarked Port</p>
        <select name="embarked">
            <option value="S">Southampton</option>
            <option value="C">Cherbourg</option>
            <option value="Q">Queenstown</option>
        </select>

        <button type="submit">Predict Survival</button>

    </form>

    {% if prediction %}
    <div class="result">
        {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
