<!DOCTYPE html>
<html>
<head>
    <title>Titanic Prediction</title>
</head>
<body>
    <h1>Titanic Prediction App</h1>

    <form method="POST">
        <input type="number" name="pclass" placeholder="Pclass"><br><br>
        <input type="text" name="sex" placeholder="Sex"><br><br>
        <input type="number" name="age" placeholder="Age"><br><br>
        <input type="number" name="sibsp" placeholder="SibSp"><br><br>
        <input type="number" name="parch" placeholder="Parch"><br><br>
        <input type="number" step="0.01" name="fare" placeholder="Fare"><br><br>
        <input type="text" name="embarked" placeholder="Embarked"><br><br>

        <button type="submit">Predict</button>
    </form>
</body>
</html>
